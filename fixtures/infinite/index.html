<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf8" />
    <title>Infinite scroll &mdash; Capturekit Fixture</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
      }
      h1 {
        padding: 2rem 1.5rem 0;
      }
      main {
        padding: 1.5rem;
        display: grid;
        gap: 0.5rem;
      }
      .row {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 0.75rem;
      }
      #sentinel {
        height: 2px;
      }
    </style>
  </head>
  <body>
    <nav aria-label="Main">
      <a href="/">Home</a>
    </nav>
    <h1>Infinite scroll</h1>
    <main id="feed"><div class="row">Item 0</div></main>
    <div id="sentinel"></div>
    <script>
      // PRD section 16 fixture: unbounded growth. A naive full-page capture
      // either misses rows or follows the page down forever, so the scroll
      // warm-up has to be bounded (FR-13) and the row cap here is the tell.
      const feed = document.getElementById('feed');
      const MAX_ROWS = 400;
      let rows = 1;
      new IntersectionObserver(
        (entries) => {
          if (!entries[0].isIntersecting || rows >= MAX_ROWS) return;
          for (let i = 0; i < 20 && rows < MAX_ROWS; i++) {
            const row = document.createElement('div');
            row.className = 'row';
            row.textContent = `Item ${rows++}`;
            feed.appendChild(row);
          }
        },
        { rootMargin: '300px' },
      ).observe(document.getElementById('sentinel'));
    </script>
  </body>
</html>
