<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pricing &mdash; Capturekit Fixture</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
      }
      h1 {
        padding: 2rem 1.5rem 0;
      }
      .tiers {
        display: grid;
        gap: 1rem;
        padding: 1.5rem;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
      .tier {
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 1.25rem;
      }
      .tier p {
        color: #444;
      }
      .price {
        font-size: 2rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>Pricing</h1>
    <div class="tiers">
      <div class="tier">
        <p>Solo</p>
        <p class="price">$0</p>
        <p>Three projects, one seat.</p>
      </div>
      <div class="tier">
        <p>Studio</p>
        <p class="price">$24</p>
        <p>Unlimited projects and reviewers.</p>
      </div>
      <div class="tier">
        <p>Agency</p>
        <p class="price">$96</p>
        <p>Seats, workspaces, and white label.</p>
      </div>
    </div>
  </body>
</html>
