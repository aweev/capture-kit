<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf8" />
    <title>Login &mdash; Capturekit Fixture</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
      }
      h1 {
        padding: 2rem 1.5rem 0;
      }
      main {
        padding: 1.5rem;
        max-width: 32rem;
      }
      label {
        display: block;
        margin-block: 0.75rem 0.25rem;
      }
      input {
        width: 100%;
        padding: 0.5rem;
        font: inherit;
      }
      button {
        margin-top: 1rem;
        padding: 0.5rem 1rem;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <h1>Login</h1>
    <main>
      <form id="login">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required />
        <button type="submit">Sign in</button>
      </form>
      <p id="wall">You are looking at the login wall. Authenticating hides this page.</p>
    </main>
    <script>
      // PRD section 16 fixture: an auth wall. The login recipe (FR-25) signs in
      // against this form and stores a cookie; the dashboard behind it is only
      // reachable with that storageState.
      document.getElementById('login').addEventListener('submit', (event) => {
        event.preventDefault();
        document.cookie = 'capturekit_session=granted; path=/';
        document.getElementById('wall').textContent = 'Signed in.';
      });
    </script>
  </body>
</html>
