        margin: 0;
        background: #fff;
      }
      p {
        color: #fff;
        font:
          400 18px system-ui,
          sans-serif;
        padding: 2rem;
      }
    </style>
  </head>

    <p>
      This paragraph is white on white. A screenshot of this page is a blank frame and must be
      rejected by the validator (FR-18).
    </p>
  </body>
